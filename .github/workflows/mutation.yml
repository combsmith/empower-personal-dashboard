# Mutation testing (mutmut) — required CI check.
#
# Plan: Discussion #123. Promoted from manual dispatch after the validation
# cycle in #126: 3 identical `all` runs at ~2.5 min each. Runs on every pull
# request and push to main (no path filter, so the required check always
# reports) and enforces the per-module gates recorded in
# docs/mutation-triage.md. Manual dispatch remains for single-target or
# report-only runs. No mutants/ cache: every run starts fresh, so a stale
# cache can never hide a regression.
#
# mutmut 3 is pytest-only and requires Python >= 3.10, so this job runs on
# Python 3.12 only (mirroring the coverage job in ci.yml). pytest collects
# the existing unittest.TestCase suite unchanged.
name: Mutation Testing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Required checks must also report for merge-queue commits.
  merge_group:
  workflow_dispatch:
    inputs:
      target:
        description: "Mutant target to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - models
          - sanitizers
          - beancount-helpers
      enforce:
        description: "Fail the run when a per-module gate is breached"
        required: true
        default: true
        type: boolean

permissions: {}

# Pull requests share one group per ref and cancel superseded runs. Pushes to
# main and manual dispatches get one group per event and commit: GitHub keeps
# only one pending run per group, so a shared group would let a dispatch on the
# same SHA displace a queued push run.
concurrency:
  group: mutation-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    # Pull request and push events have no inputs: they run `all`, enforced,
    # as "mutation (all)", the required status check context. Manual
    # dispatches get a distinct name so a report-only run (enforce=false) can
    # never satisfy the required check on a PR head.
    name: ${{ github.event_name == 'workflow_dispatch' && format('mutation dispatch ({0})', inputs.target) || 'mutation (all)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[mcp,test,mutation]"

      - name: Resolve mutant patterns
        id: patterns
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          case "$TARGET" in
            models)
              echo 'patterns=empower_personal_dashboard.models*' >> "$GITHUB_OUTPUT"
              ;;
            sanitizers)
              echo 'patterns=empower_personal_dashboard.sanitizers*' >> "$GITHUB_OUTPUT"
              ;;
            beancount-helpers)
              echo 'patterns=empower_personal_dashboard.beancount.x*_safe_float* empower_personal_dashboard.beancount.x*_safe_positive_float* empower_personal_dashboard.beancount.x*_is_negative_number* empower_personal_dashboard.beancount.x*_clean_tx_description* empower_personal_dashboard.beancount.x*_has_core_sweep_evidence* empower_personal_dashboard.beancount.x*_is_dividend_signal* empower_personal_dashboard.beancount.x*_classify_buy_sell* empower_personal_dashboard.beancount.x*_is_commodity_trade_tx* empower_personal_dashboard.beancount.x*_has_investment_account_signal* empower_personal_dashboard.beancount.x*_is_investment_tx*' >> "$GITHUB_OUTPUT"
              ;;
            all)
              echo 'patterns=empower_personal_dashboard.models* empower_personal_dashboard.sanitizers* empower_personal_dashboard.beancount.x*_safe_float* empower_personal_dashboard.beancount.x*_safe_positive_float* empower_personal_dashboard.beancount.x*_is_negative_number* empower_personal_dashboard.beancount.x*_clean_tx_description* empower_personal_dashboard.beancount.x*_has_core_sweep_evidence* empower_personal_dashboard.beancount.x*_is_dividend_signal* empower_personal_dashboard.beancount.x*_classify_buy_sell* empower_personal_dashboard.beancount.x*_is_commodity_trade_tx* empower_personal_dashboard.beancount.x*_has_investment_account_signal* empower_personal_dashboard.beancount.x*_is_investment_tx*' >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run mutation tests
        env:
          PATTERNS: ${{ steps.patterns.outputs.patterns }}
        run: |
          # Word-splitting is intentional: each pattern is one mutmut argument.
          # shellcheck disable=SC2086
          mutmut run $PATTERNS
          mutmut export-cicd-stats || true

      - name: Report per-module scores
        env:
          # Enforced unless a manual dispatch sets enforce=false.
          ENFORCE: ${{ github.event_name != 'workflow_dispatch' || inputs.enforce }}
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          # Gates are the --threshold values recorded in docs/mutation-triage.md.
          # Only the selected target is gated: unselected modules have no
          # decided mutants on a fresh runner and would false-fail. With
          # enforcement on, the wrapper exits 1 on a breach and fails the job.
          if [ "$ENFORCE" = "true" ]; then
            args=()
            case "$TARGET" in
              models|all) args+=(--threshold models=95) ;;
            esac
            case "$TARGET" in
              sanitizers|all) args+=(--threshold sanitizers=90) ;;
            esac
            case "$TARGET" in
              beancount-helpers|all) args+=(--threshold beancount=91) ;;
            esac
            python scripts/check_mutation_thresholds.py --mutants-dir mutants "${args[@]}"
          else
            python scripts/check_mutation_thresholds.py --mutants-dir mutants --report-only
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ inputs.target || 'all' }}
          path: |
            mutants/**/*.meta
          retention-days: 30
          if-no-files-found: warn
