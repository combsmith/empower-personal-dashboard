[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "empower-personal-dashboard"
version = "0.8.0"
description = "Python client and CLI for Empower Personal Dashboard (formerly Personal Capital) with 2FA, session persistence, holdings, and transactions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Don Petry" }
]
keywords = [
    "empower",
    "personal-capital",
    "finance",
    "net-worth",
    "investments",
    "holdings",
    "transactions",
    "banking",
    "api-client",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2.0; python_version >= '3.10'",
]
keyring = [
    "keyring>=24.0.0",
]
test = [
    "beancount>=3.0.0",
    "jsonschema[format-nongpl]>=4.20.0",
    "referencing>=0.30.0",
    "pyyaml>=6.0",
    "tomli>=1.1.0; python_version < '3.11'",
    "coverage>=7.0",
]
# Provides YAML mapping support plus external Beancount ledger validation tools (e.g. bean-check / beancount.loader).
beancount = [
    "beancount>=3.0.0",
    "pyyaml>=6.0",
]
build = [
    "build>=1.0",
    "twine>=5.0",
]
# Mutation testing pilot (see docs/mutation-triage.md). mutmut 3 is
# pytest-only and requires Python >= 3.10, so this extra is installed
# only by the workflow_dispatch mutation job on Python 3.12. pytest runs
# the existing unittest.TestCase suite unchanged. pytest is capped below
# 9.2: mutmut 3.8's harness reads the private `item._nodeid`, which pytest
# 9.2 removed, so stats collection crashes. Lift the cap once mutmut ships
# a compatible release.
mutation = [
    "mutmut>=3.8,<4",
    "pytest>=8.0,<9.2",
]
dev = [
    "beancount>=3.0.0",
    "pytest>=8.0",
    "build>=1.0",
    "twine>=5.0",
    "jsonschema[format-nongpl]>=4.20.0",
    "referencing>=0.30.0",
    "pyyaml>=6.0",
    "keyring>=24.0.0",
    "tomli>=1.1.0; python_version < '3.11'",
    "coverage>=7.0",
]
all = [
    "beancount>=3.0.0",
    "mcp>=1.2.0; python_version >= '3.10'",
    "keyring>=24.0.0",
    "jsonschema[format-nongpl]>=4.20.0",
    "referencing>=0.30.0",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "build>=1.0",
    "twine>=5.0",
    "tomli>=1.1.0; python_version < '3.11'",
    "coverage>=7.0",
]

[project.scripts]
empower = "empower_personal_dashboard.cli:main"
empower-mcp = "empower_personal_dashboard.mcp_server:main"

[project.urls]
Homepage = "https://github.com/combsmith/empower-personal-dashboard"
Documentation = "https://github.com/combsmith/empower-personal-dashboard#readme"
Changelog = "https://github.com/combsmith/empower-personal-dashboard/blob/main/CHANGELOG.md"
Issues = "https://github.com/combsmith/empower-personal-dashboard/issues"
Repository = "https://github.com/combsmith/empower-personal-dashboard.git"
"Commercial Support" = "https://combsmith.com"

[tool.setuptools.packages.find]
where = ["."]
include = ["empower_personal_dashboard*"]

# Mutation testing (mutmut 3). Pilot scope is enforced at run time via the
# mutant-name pattern passed to `mutmut run` (see .github/workflows/mutation.yml);
# source_paths stays at the package root so later phases can widen scope
# without config churn. Test selection is limited to the pilot test modules:
# pytest collects the unittest.TestCase tests in them unchanged.
[tool.mutmut]
source_paths = ["empower_personal_dashboard/"]
pytest_add_cli_args_test_selection = [
    "tests/test_models.py",
    "tests/test_sanitizers.py",
    "tests/test_beancount.py",
    "tests/test_beancount_helpers.py",
]
# Log lines and raises carry message strings whose mutation is noise, not
# behaviour. mutmut 3 re.search()es each line and skips every expression that
# starts on a matching line, so patterns are anchored to the statement start:
# an unanchored `logger\.\w+` would also skip `if not self.logger.handlers:`.
do_not_mutate_patterns = [
    '^\s*(?:self\.)?logger\.\w+\(',
    '^\s*(?:self\.)?_log_debug\(',
    '^\s*raise\s',
]
